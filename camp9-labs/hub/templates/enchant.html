{% extends "base.html" %}
{% block title %}Enchantment Table{% endblock %}
{# lab.txt §4.2 — flag assigned BEFORE the injectable line. NO CSP header on this route. #}
{% block head %}
  <script>
    {# Defined ONLY when the server confirms q breaks out of the JS string. No valid payload
       -> enchantFlag never exists, so view-source / atob() in the Console reveals nothing. #}
    {% if enchant_ok %}window.enchantFlag = atob("{{ enchant_b64 }}");{% endif %}
    function renderItem(x){ try { document.getElementById('item').textContent = 'Enchanting: ' + x; } catch (e) {} }
  </script>
{% endblock %}
{% block content %}
  <img class="page-icon" src="/assets/img/Enchanting_Table.png" alt="">
  <h2>✨ Enchantment Table</h2>
  <div id="item"></div>
  <script>
    var item = '{{ q | safe }}';     {# JS single-quoted-string context -> XSS-3 #}
    renderItem(item);
  </script>
  <form><input name="q" placeholder="item name"><button>Enchant</button></form>
{% endblock %}
